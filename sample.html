<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Data Sample | Home Owner Leads</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
    <script>
        // Force dark mode by default unless the user explicitly saved 'light'
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-neutral-950 text-slate-900 dark:text-neutral-100 antialiased min-h-screen flex flex-col font-sans">

    <!-- Navigation Area (Simplified for focus) -->
    <nav class="py-6 px-6 text-center">
        <a href="index.html" class="text-xl font-extrabold tracking-tight text-slate-950 dark:text-white inline-flex items-center gap-2 hover:opacity-80 transition">
            <span class="w-3 h-3 bg-blue-600 dark:bg-blue-500 rounded-full"></span> Back to Home
        </a>
    </nav>

    <!-- Form Layout Wrapper -->
    <main class="max-w-lg mx-auto px-6 py-10 flex-grow w-full">
        <div class="bg-white dark:bg-neutral-900 p-8 md:p-10 rounded-3xl border border-slate-200/60 dark:border-neutral-800/60 shadow-xl shadow-slate-100/40 dark:shadow-none">
            <h1 class="text-2xl font-bold tracking-tight text-slate-950 dark:text-white mb-2">Request Realtor/Zillow Sample Data</h1>
            <p class="text-xs font-medium text-slate-500 dark:text-neutral-400 mb-8 leading-relaxed">Tell us your geographic target. We will scrape and format a free sample list of active real estate agents or property data for you to verify our quality.</p>
            
            <form action="https://formspree.io/f/xnjynler" method="POST" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-neutral-400 mb-2">Your Name</label>
                    <input type="text" name="name" class="w-full p-3 bg-slate-50 dark:bg-neutral-950 border border-slate-200/80 dark:border-neutral-800 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:outline-none" required>
                </div>
                
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-neutral-400 mb-2">Email Address</label>
                    <input type="email" name="email" class="w-full p-3 bg-slate-50 dark:bg-neutral-950 border border-slate-200/80 dark:border-neutral-800 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-neutral-400 mb-2">Data Type Needed</label>
                    <select name="data-type" class="w-full p-3 bg-slate-50 dark:bg-neutral-950 border border-slate-200/80 dark:border-neutral-800 rounded-xl text-sm text-slate-700 dark:text-neutral-300 focus:outline-none">
                        <option value="realtor-leads">Active Realtor & Agent Leads</option>
                        <option value="zillow-properties">Zillow Property / Listing Extraction</option>
                        <option value="fsbo-leads">For Sale By Owner (FSBO) Leads</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-neutral-400 mb-2">Target City & State</label>
                    <input type="text" name="location" placeholder="e.g., Miami, FL or Austin, TX" class="w-full p-3 bg-slate-50 dark:bg-neutral-950 border border-slate-200/80 dark:border-neutral-800 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:outline-none" required>
                </div>

                <button type="submit" class="w-full bg-blue-600 dark:bg-blue-500 text-white py-3.5 rounded-xl text-sm font-semibold hover:bg-blue-700 transition shadow-md">Send My Free Sample</button>
            </form>
        </div>
    </main>

</body>
</html>
