    <script>
        const GITHUB_BASE_URL = 'https://raw.githubusercontent.com/Ahsan12116/my-landing-page/main/samples/';
        const usStates = [
            { code: "AL", name: "Alabama" },{ code: "AK", name: "Alaska" },{ code: "AZ", name: "Arizona" },
            { code: "AR", name: "Arkansas" },{ code: "CA", name: "California" },{ code: "CO", name: "Colorado" },
            { code: "CT", name: "Connecticut" },{ code: "DE", name: "Delaware" },{ code: "FL", name: "Florida" },
            { code: "GA", name: "Georgia" },{ code: "HI", name: "Hawaii" },{ code: "ID", name: "Idaho" },
            { code: "IL", name: "Illinois" },{ code: "IN", name: "Indiana" },{ code: "IA", name: "Iowa" },
            { code: "KS", name: "Kansas" },{ code: "KY", name: "Kentucky" },{ code: "LA", name: "Louisiana" },
            { code: "ME", name: "Maine" },{ code: "MD", name: "Maryland" },{ code: "MA", name: "Massachusetts" },
            { code: "MI", name: "Michigan" },{ code: "MN", name: "Minnesota" },{ code: "MS", name: "Mississippi" },
            { code: "MO", name: "Missouri" },{ code: "MT", name: "Montana" },{ code: "NE", name: "Nebraska" },
            { code: "NV", name: "Nevada" },{ code: "NH", name: "New Hampshire" },{ code: "NJ", name: "New Jersey" },
            { code: "NM", name: "New Mexico" },{ code: "NY", name: "New York" },{ code: "NC", name: "North Carolina" },
            { code: "ND", name: "North Dakota" },{ code: "OH", name: "Ohio" },{ code: "OK", name: "Oklahoma" },
            { code: "OR", name: "Oregon" },{ code: "PA", name: "Pennsylvania" },{ code: "RI", name: "Rhode Island" },
            { code: "SC", name: "South Carolina" },{ code: "SD", name: "South Dakota" },{ code: "TN", name: "Tennessee" },
            { code: "TX", name: "Texas" },{ code: "UT", name: "Utah" },{ code: "VT", name: "Vermont" },
            { code: "VA", name: "Virginia" },{ code: "WA", name: "Washington" },{ code: "WV", name: "West Virginia" },
            { code: "WI", name: "Wisconsin" },{ code: "WY", name: "Wyoming" }
        ];

        let currentActiveData = [], currentStateValue = "", currentColumns = [];
        const dropdownTrigger = document.getElementById('dropdownTrigger');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const dropdownIcon = document.getElementById('dropdownIcon');
        const selectedStateText = document.getElementById('selectedStateText');
        const customSelectContainer = document.getElementById('customSelectContainer');
        const tbody = document.getElementById('sample-tbody');
        const tableHeader = document.getElementById('tableHeader');
        const actionContainer = document.getElementById('actionContainer');
        const recordCount = document.getElementById('recordCount');
        const selectedStateBadge = document.getElementById('selectedStateBadge');

        // STRICT PRICE COLUMNS ONLY - these are the ONLY columns that get $ sign
        const priceColumnNames = [
            'list price', 'price', 'sale price', 'asking price', 'sold price',
            'listing price', 'original price', 'current price', 'market price',
            'rent price', 'rental price', 'monthly rent', 'annual rent',
            'amount', 'cost', 'fee', 'value', 'payment', 'monthly payment',
            'hoa fee', 'hoa dues', 'property value', 'estimated value',
            'tax value', 'assessed value', 'zestimate', 'redfin estimate'
        ];

        function filterColumns(columns) {
            return columns.filter(col => {
                const lower = col.toLowerCase().trim();
                if (/(phone|mobile|cell|tel|fax).*(2|ii|second|alt|other|alternate|additional|extra)/i.test(lower)) return false;
                if (/(2|ii|second|alt|other|alternate|additional|extra).*(phone|mobile|cell|tel|fax)/i.test(lower)) return false;
                if (/phone\s*2|phone\s*#2|phone\s*ii/i.test(lower)) return false;
                if (/mobile\s*2|cell\s*2|tel\s*2/i.test(lower)) return false;
                return true;
            });
        }

        // STRICT CHECK: Only return true if column name is explicitly a price column
        function isPriceColumn(colName) {
            if (!colName) return false;
            const lower = colName.toLowerCase().trim();
            return priceColumnNames.some(priceCol => lower.includes(priceCol));
        }

        function isURL(text) {
            if (!text) return false;
            const str = String(text).trim();
            if (str.includes('@')) return false;
            return /^https?:\/\//i.test(str) || /^www\./i.test(str) || /\.(com|org|net|io|co|gov|edu|us|info|biz)\b/i.test(str);
        }

        function isEmail(text) {
            if (!text) return false;
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(text).trim());
        }

        function extractFirstPhone(text) {
            if (!text) return '';
            const str = String(text).trim();
            const phoneRegex = /(\+?\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/g;
            const matches = str.match(phoneRegex);
            return matches && matches.length > 0 ? matches[0].trim() : '';
        }

        function formatCell(value, colName) {
            if (value === null || value === undefined || value === '') return '—';
            const str = String(value).trim();
            
            if (isEmail(str)) {
                return `<a href="mailto:${str}" title="Send email to ${str}">📧 ${str}</a>`;
            }
            
            if (isURL(str)) {
                let href = str;
                if (!href.startsWith('http')) href = 'https://' + href;
                const display = str.length > 40 ? str.substring(0, 40) + '...' : str;
                return `<a href="${href}" target="_blank" rel="noopener" title="Open ${str}">🔗 ${display}</a>`;
            }
            
            const firstPhone = extractFirstPhone(str);
            if (firstPhone) {
                const cleaned = firstPhone.replace(/[\s\-\(\)\.]/g, '');
                return `<a href="tel:${cleaned}" title="Call ${firstPhone}">📞 ${firstPhone}</a>`;
            }
            
            // PRICE - ONLY if column name is explicitly a price column
            if (isPriceColumn(colName)) {
                // Check if it's a valid number
                const cleaned = str.replace(/[$,]/g, '');
                if (/^\d+$/.test(cleaned) && parseInt(cleaned) > 0) {
                    return `<span class="price-cell">$${Number(cleaned).toLocaleString()}</span>`;
                }
            }
            
            return str;
        }

        function initCustomDropdown() {
            usStates.forEach(state => {
                const li = document.createElement('li');
                li.className = "dropdown-item px-5 py-3 text-slate-300 border-b border-slate-700/30 last:border-0 flex items-center gap-3";
                li.innerHTML = `<span class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500/20 to-purple-500/20 flex items-center justify-center text-xs font-bold text-blue-400">${state.code}</span><span>${state.name}</span>`;
                li.addEventListener('click', () => {
                    currentStateValue = state.code;
                    selectedStateText.textContent = `${state.name} (${state.code})`;
                    selectedStateText.classList.remove('text-slate-400');
                    selectedStateText.classList.add('text-white', 'font-medium');
                    closeDropdown();
                    fetchDataForState(state.code);
                });
                dropdownMenu.appendChild(li);
            });
        }

        function toggleDropdown() {
            const isClosed = dropdownMenu.classList.contains('dropdown-closed');
            if (isClosed) {
                dropdownMenu.classList.remove('dropdown-closed');
                dropdownMenu.classList.add('dropdown-open');
                dropdownIcon.classList.add('rotate-180');
            } else { closeDropdown(); }
        }

        function closeDropdown() {
            dropdownMenu.classList.remove('dropdown-open');
            dropdownMenu.classList.add('dropdown-closed');
            dropdownIcon.classList.remove('rotate-180');
        }

        dropdownTrigger.addEventListener('click', (e) => { e.preventDefault(); toggleDropdown(); });
        document.addEventListener('click', (e) => { if (!customSelectContainer.contains(e.target)) closeDropdown(); });

        async function fetchDataForState(selectedState) {
            clearTable(`Fetching data for ${selectedState}...`);
            try {
                const fileUrl = `${GITHUB_BASE_URL}${selectedState}.xlsx`;
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error(`File not found`);
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                let rawData = XLSX.utils.sheet_to_json(worksheet);
                currentActiveData = rawData.map(row => ({ ...row }));
                const allColumns = rawData.length > 0 ? Object.keys(rawData[0]) : [];
                currentColumns = filterColumns(allColumns);
                renderTable(currentActiveData, selectedState);
            } catch (error) {
                currentActiveData = []; currentColumns = [];
                clearTable(`No data file found for ${selectedState} yet.`);
            }
        }

        function renderTable(data, stateCode) {
            if (!data || data.length === 0) { 
                clearTable(`The data file for ${stateCode} is empty.`); 
                return; 
            }

            actionContainer.classList.remove('hidden');
            recordCount.textContent = data.length;
            selectedStateBadge.textContent = stateCode;
            
            const columnsToShow = currentColumns.length > 0 ? currentColumns : 
                ['Agent Name', 'Phone', 'Email', 'Agency', 'City', 'State'];
            
            const colWidth = Math.floor(100 / (columnsToShow.length + 1));
            const colStyle = `width: ${colWidth}%;`;
            
            tableHeader.innerHTML = `<tr>
                <th style="width: 32px;">#</th>
                ${columnsToShow.map(col => 
                    `<th style="${colStyle}" title="${col}"><span class="header-content">${col}</span></th>`
                ).join('')}
            </tr>`;
            
            tbody.innerHTML = data.map((lead, index) => `
                <tr>
                    <td>${index + 1}</td>
                    ${columnsToShow.map(col => {
                        const value = lead[col] || '';
                        const formatted = formatCell(value, col);
                        const plainText = String(value || '—').replace(/"/g, '&quot;');
                        return `<td data-label="${col}" style="${colStyle}" title="${plainText}"><span class="cell-content">${formatted}</span></td>`;
                    }).join('')}
                </tr>
            `).join('');
        }

        function clearTable(message) {
            actionContainer.classList.add('hidden');
            tableHeader.innerHTML = `<tr><th style="width: 32px;">#</th><th>Agent Name</th><th>Phone</th><th>Email</th><th>Agency</th><th>City</th><th>State</th></tr>`;
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-16 text-slate-500" style="white-space: normal;">${message}</td></tr>`;
        }

        document.getElementById('copyBtn').addEventListener('click', function() {
            if(currentActiveData.length === 0) return;
            const columnsToUse = currentColumns.length > 0 ? currentColumns : ['Agent Name', 'Phone', 'Email', 'Agency', 'City', 'State'];
            const headers = columnsToUse.join('\t') + '\n';
            const rows = currentActiveData.map(row => columnsToUse.map(col => row[col] || '').join('\t')).join('\n');
            navigator.clipboard.writeText(headers + rows).then(() => {
                const orig = this.innerHTML;
                this.innerHTML = `<svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied!`;
                setTimeout(() => this.innerHTML = orig, 2000);
            });
        });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            if(currentActiveData.length === 0) return;
            const columnsToUse = currentColumns.length > 0 ? currentColumns : ['Agent Name', 'Phone', 'Email', 'Agency', 'City', 'State'];
            const headers = columnsToUse.map(col => `"${col}"`).join(',') + '\n';
            const rows = currentActiveData.map(row => columnsToUse.map(col => `"${(row[col]||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
            const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `home_owner_leads_${currentStateValue}.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        });

        initCustomDropdown();
    </script>
</body>
</html>
